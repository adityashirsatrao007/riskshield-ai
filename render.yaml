services:
  - type: web
    name: riskshield-ai
    runtime: docker
    dockerfilePath: Dockerfile.heroku
    envVars:
      - key: RISKSHIELD_API_KEY
        value: demo-key-123
      - key: MODEL_PATH
        value: /app/ml_models/fraud_detector_v2.joblib
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/riskshield.db
      - key: PYTHONPATH
        value: /app/backend
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /health
    autoDeploy: true
