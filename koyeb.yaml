services:
  - name: riskshield-ai
    dockerfile: Dockerfile.heroku
    instance_type: nano
    ports:
      - port: 8000
        protocol: http
    env:
      - name: RISKSHIELD_API_KEY
        value: demo-key-123
      - name: MODEL_PATH
        value: /app/ml_models/fraud_detector_v2.joblib
      - name: SECRET_KEY
        value: riskshield-production-key-2026
      - name: PYTHONPATH
        value: /app/backend
      - name: LOG_LEVEL
        value: INFO
    healthcheck:
      path: /health
      port: 8000
    auto_deploy: true
