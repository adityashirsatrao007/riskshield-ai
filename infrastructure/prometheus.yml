global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: riskshield-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000
        labels:
          service: riskshield-api

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
    scrape_interval: 30s
